# Throwaway MongoDB for the test suite (single-node replica set, so transactions work).
# Never point tests at Atlas.
services:
  mongo:
    image: mongo:9.0  # 8.x refuses to start on Linux kernel >= 6.19 (SERVER-121912)
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    tmpfs:
      - /data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once this node is primary.
      test:
        - CMD
        - mongosh
        - --port
        - "27018"
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27018'}]}).ok }; db.hello().isWritablePrimary || quit(1)"
      interval: 2s
      timeout: 5s
      retries: 30
