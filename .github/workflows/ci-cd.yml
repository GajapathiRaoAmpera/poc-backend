# CI on every PR and push; CD to Cloud Run on push to main.
# One-time GCP setup and the repo variables/secrets this needs: see README "Deploy (Cloud Run)".
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  API_SERVICE: poc-backend-api
  WORKER_POOL: poc-backend-worker
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/poc-backend/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      # Same throwaway replica-set MongoDB the local `make test` uses.
      - run: docker compose -f compose.test.yml up -d --wait
      - run: uv run pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no service-account key in GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API (Cloud Run service)
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --timeout 300 \
            --set-env-vars "ENVIRONMENT=production,APP_ORIGIN=${{ vars.APP_ORIGIN }},MONGODB_DB=${{ vars.MONGODB_DB }}" \
            --set-secrets "MONGODB_URI=mongodb-uri:latest,GROQ_API_KEY=groq-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest"

      # The worker polls MongoDB forever and serves no HTTP, so it's a worker pool
      # (always-on CPU, no port), not a service that scales to zero.
      - name: Deploy worker (Cloud Run worker pool)
        run: |
          gcloud beta run worker-pools deploy "$WORKER_POOL" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --instances 1 \
            --command python --args=-m,app.worker \
            --set-env-vars "ENVIRONMENT=production,APP_ORIGIN=${{ vars.APP_ORIGIN }},MONGODB_DB=${{ vars.MONGODB_DB }}" \
            --set-secrets "MONGODB_URI=mongodb-uri:latest,GROQ_API_KEY=groq-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest"

      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$API_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 3 "$url/api/v1/health"
          echo "API URL: $url" >> "$GITHUB_STEP_SUMMARY"
